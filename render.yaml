services:
  - type: web
    name: ecommerce-reconciliation
    runtime: docker
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/backend/data
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536
      - key: CRON_ENABLED
        value: "false"
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
